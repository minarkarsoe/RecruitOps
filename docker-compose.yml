# Local development + production reference topology for RecruitOps (ADR-0004 & ADR-0013).
# Quick start: cp .env.example .env && docker compose up --build
name: recruitops

# MinIO server, with `mc` and a shell in the same image — so it also runs the bucket job below.
# ADR-0029: `minio/minio` and `minio/mc` no longer exist on Docker Hub (upstream retired the
# community edition), so every `up` failed to pull. Chainguard rebuilds this from MinIO's source.
# Pinned by digest because the free tier publishes only `latest`; bump it on purpose:
#   docker pull chainguard/minio:latest
#   docker image inspect chainguard/minio:latest --format '{{index .RepoDigests 0}}'
# The same line is in docker-compose.prod.yml — change both.
x-minio-image: &minio-image chainguard/minio:latest@sha256:2136d593beacf4461187035eca949fe49abd589d5079735025c711ca58fee0c8

services:
  db:
    # Do NOT lower this major version. A Postgres data directory cannot be downgraded in place:
    # a `pgdata` volume written by 17 makes 16 exit(1) with "database files are incompatible with
    # server", so every existing install and every developer machine stops booting. This was
    # briefly 16 and nothing caught it — the whole suite runs on EF's in-memory provider, so no
    # test touches a real Postgres at all.
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-recruitops}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init-pgtrgm.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-recruitops}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot, before MinIO starts: hand the data volume to the image's non-root user (65532).
  # Volumes written before ADR-0029 belong to root (minio/minio ran as root), and on them the new
  # image stops at once with "Unable to write to the backend". Measured 2026-10-16.
  storage-init:
    image: *minio-image
    user: "0:0"
    entrypoint: ["chown", "-R", "65532:65532", "/data"]
    volumes:
      - miniodata:/data

  # S3-compatible storage. Mirrors the on-premise path from ADR-0013
  # (hosted installs use Cloudflare R2 through the same abstraction).
  storage:
    image: *minio-image
    depends_on:
      storage-init:
        condition: service_completed_successfully
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Creates the CV bucket and makes it PRIVATE, on every start — so a bucket left public by an
  # older version of this file is closed by the next `up`. Until ADR-0029 this set `anonymous
  # download`, which let anyone who could reach port 9000 list every CV and fetch it with no
  # credentials. Nothing needs that: CVs reach a browser only through the API
  # (`GET /api/applications/{id}/resume`), which checks who is asking. If the bucket cannot be
  # confirmed private this exits 1, and the API — which depends on it — does not start.
  create-buckets:
    image: *minio-image
    depends_on:
      storage:
        condition: service_healthy
    environment:
      MINIO_USER: ${MINIO_USER:-minioadmin}
      MINIO_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mc alias set myminio http://storage:9000 "$$MINIO_USER" "$$MINIO_PASSWORD" > /dev/null
        mc mb --ignore-existing myminio/recruitops-cvs
        mc anonymous set none myminio/recruitops-cvs
        case "$$(mc anonymous get myminio/recruitops-cvs)" in
          *'`private`'*) echo "recruitops-cvs is private" ;;
          *) echo "recruitops-cvs is NOT private - stopping" >&2; exit 1 ;;
        esac

  backend:
    build:
      context: ./backend
      target: final
      args:
        # Shown by /api/version. `GIT_SHA=$(git rev-parse HEAD) docker compose up --build`.
        GIT_SHA: ${GIT_SHA:-}
    networks:
      default:
        aliases:
          - api
    depends_on:
      db:
        condition: service_healthy
      create-buckets:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:-recruitops};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      Jwt__Issuer: recruitops
      Jwt__Audience: recruitops-api
      Jwt__Key: ${JWT_KEY:?set JWT_KEY in .env - must be at least 32 characters}
      # First Administrator — see .env.example. This file runs the API as Development (above), so
      # the Development rules apply here: the seed runs on every start, there is no 12-character
      # minimum, and the API accepts the example JWT key. Not a production install.
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:-}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-}
      FileStorage__ServiceUrl: "http://storage:9000"
      FileStorage__PublicServiceUrl: "http://localhost:9000"
      FileStorage__BucketName: "recruitops-cvs"
      FileStorage__AccessKey: ${MINIO_USER:-minioadmin}
      FileStorage__SecretKey: ${MINIO_PASSWORD:-minioadmin}
      FileStorage__ForcePathStyle: "true"
    ports:
      # ⚠️ Publishing this port is a DEV convenience (Swagger, curl against the API directly).
      - "${API_PORT:-5080}:8080"

  # Internal dashboards (Vite SPA behind nginx).
  frontend-internal:
    build:
      context: .
      dockerfile: frontend/internal/Dockerfile
      target: final
    depends_on:
      - backend
    ports:
      - "${INTERNAL_PORT:-5173}:80"

  # Public job pages (Next.js SSR).
  frontend-public:
    build:
      context: .
      dockerfile: frontend/public/Dockerfile
      target: final
      args:
        # Needed at BUILD time, not just runtime: Next freezes next.config.mjs `rewrites()` into
        # .next/routes-manifest.json during `next build`. Passing this only under `environment`
        # below leaves the localhost fallback baked in, and every browser-side /api call 500s
        # with ECONNREFUSED while SSR keeps working — which is why it went unnoticed.
        API_INTERNAL_URL: "http://backend:8080/api"
    depends_on:
      - backend
    environment:
      # Still required at runtime: server-side rendering calls the API through this directly,
      # without going through the rewrite.
      API_INTERNAL_URL: "http://backend:8080/api"
      NEXT_PUBLIC_API_BASE_URL: "/api"
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
  miniodata:
