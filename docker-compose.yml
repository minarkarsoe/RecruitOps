# Local development + production reference topology for RecruitOps (ADR-0004 & ADR-0013).
# Quick start: cp .env.example .env && docker compose up --build
name: recruitops

services:
  db:
    # Do NOT lower this major version. A Postgres data directory cannot be downgraded in place:
    # a `pgdata` volume written by 17 makes 16 exit(1) with "database files are incompatible with
    # server", so every existing install and every developer machine stops booting. This was
    # briefly 16 and nothing caught it — the whole suite runs on EF's in-memory provider, so no
    # test touches a real Postgres at all.
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-recruitops}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init-pgtrgm.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-recruitops}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible storage. Mirrors the on-premise path from ADR-0013
  # (hosted installs use Cloudflare R2 through the same abstraction).
  storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Auto-creates the recruitops-cvs bucket in MinIO on startup
  create-buckets:
    image: minio/mc:latest
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://storage:9000 ${MINIO_USER:-minioadmin} ${MINIO_PASSWORD:-minioadmin};
      /usr/bin/mc mb --ignore-existing myminio/recruitops-cvs;
      /usr/bin/mc anonymous set download myminio/recruitops-cvs;
      exit 0;
      "

  backend:
    build:
      context: ./backend
      target: final
    networks:
      default:
        aliases:
          - api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:-recruitops};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      Jwt__Issuer: recruitops
      Jwt__Audience: recruitops-api
      Jwt__Key: ${JWT_KEY:?set JWT_KEY in .env - must be at least 32 characters}
      # Optional dev seed: creates one company + admin on startup when both are set.
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:-}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-}
      FileStorage__ServiceUrl: "http://storage:9000"
      FileStorage__PublicServiceUrl: "http://localhost:9000"
      FileStorage__BucketName: "recruitops-cvs"
      FileStorage__AccessKey: ${MINIO_USER:-minioadmin}
      FileStorage__SecretKey: ${MINIO_PASSWORD:-minioadmin}
      FileStorage__ForcePathStyle: "true"
    ports:
      # ⚠️ Publishing this port is a DEV convenience (Swagger, curl against the API directly).
      - "${API_PORT:-5080}:8080"

  # Internal dashboards (Vite SPA behind nginx).
  frontend-internal:
    build:
      context: .
      dockerfile: frontend/internal/Dockerfile
      target: final
    depends_on:
      - backend
    ports:
      - "${INTERNAL_PORT:-5173}:80"

  # Public job pages (Next.js SSR).
  frontend-public:
    build:
      context: .
      dockerfile: frontend/public/Dockerfile
      target: final
      args:
        # Needed at BUILD time, not just runtime: Next freezes next.config.mjs `rewrites()` into
        # .next/routes-manifest.json during `next build`. Passing this only under `environment`
        # below leaves the localhost fallback baked in, and every browser-side /api call 500s
        # with ECONNREFUSED while SSR keeps working — which is why it went unnoticed.
        API_INTERNAL_URL: "http://backend:8080/api"
    depends_on:
      - backend
    environment:
      # Still required at runtime: server-side rendering calls the API through this directly,
      # without going through the rewrite.
      API_INTERNAL_URL: "http://backend:8080/api"
      NEXT_PUBLIC_API_BASE_URL: "/api"
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
  miniodata:
