# Continuous integration.
#
# This exists because "written but never compiled" repeated across three sessions: the
# authoring environments had no .NET SDK, no Docker, and an allowlist blocking both
# `mcr.microsoft.com` and `nuget.org`, so the ADR-0018 fix and the ADR-0019 endpoint sat in
# the working tree unverified. A hosted runner has none of those constraints, so the
# compiler runs on every push whether or not the author could run it locally.
#
# The backend job deliberately mirrors the command in CLAUDE.md rather than using
# `actions/setup-dotnet`: the Dockerfile is the packaging artefact (ADR-0015), so building
# it is also a check that the image still builds.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push on the same branch makes the previous run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — build + test (.NET 10, Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      # `--progress=plain` because BuildKit collapses test output, and
      # `--no-cache-filter=build,test` because a cached `COPY . .` layer will happily
      # re-report an old pass count — the trap documented in FEATURE-STATUS.md. Without
      # both flags a green build is not evidence the *new* tests ran.
      - name: docker build --target test
        run: |
          set -o pipefail
          docker build \
            --target test \
            --progress=plain \
            --no-cache-filter=build,test \
            -t recruitops-test \
            ./backend 2>&1 | tee build.log

      # "The build passed" has never been the question in this repo — "did the new tests
      # run" is. Lift the counts out of 3,000 lines of BuildKit output and into the job
      # summary, so nobody has to trust a green tick they did not read.
      #
      # The first version of this step grepped for `Passed!`, which is the *Microsoft
      # Testing Platform* summary line. This solution runs on **VSTest**
      # (Microsoft.NET.Test.Sdk + xunit.runner.visualstudio), which ends with
      #   Test Run Successful. / Total tests: 39 / Passed: 39
      # — no exclamation mark anywhere. So the grep matched nothing, and because the
      # fallback `|| echo` was attached to a *pipeline* whose last command was `sed`
      # (exit 0), it never fired either: the summary rendered as an empty box on run #3.
      # An empty box is worse than a missing one — it looks like a report. Hence the
      # explicit emptiness check below.
      #
      # `dotnet test` on a .sln runs the MSBuild VSTest target once per test project, so
      # there are TWO summaries (Domain, then Api). The `Test run for …dll` lines are kept
      # so each count is attributable to an assembly rather than silently added together.
      - name: Test counts
        if: always()
        run: |
          if [ ! -f build.log ]; then
            echo '## Backend test run' >> "$GITHUB_STEP_SUMMARY"
            echo 'The build step produced no log — it failed before the compiler was reached.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          summary=$(grep -E 'Test run for |Test Run Successful\.|Test Run Failed\.|Total tests:|Passed:|Failed:|Skipped:|Passed!|Failed!|error [A-Z]+[0-9]+' build.log \
            | sed -E 's/^#[0-9]+ +[0-9.]+ +//' || true)

          # Counted independently of any summary line, straight off the per-test output, and
          # keyed on the assembly's namespace. This is the number that cannot be misread: a
          # solution-wide run prints two interleaved summaries, so an aggregate "Total tests"
          # sitting under `Starting: RecruitOps.Api.Tests` tells you nothing about which
          # assembly produced it. These two do.
          # `grep -c` prints 0 and exits 1 when nothing matches, so `|| true` keeps `bash -e`
          # from killing the step on the very case this is here to report.
          domain=$(grep -c 'Passed RecruitOps\.Domain\.Tests\.' build.log || true)
          api=$(grep -c 'Passed RecruitOps\.Api\.Tests\.' build.log || true)
          domain=${domain:-0}
          api=${api:-0}

          {
            echo '## Backend test run'
            echo ''
            echo '| Assembly | Cases passed |'
            echo '|---|---|'
            echo "| RecruitOps.Domain.Tests | ${domain} |"
            echo "| RecruitOps.Api.Tests | ${api} |"
            echo ''
            echo '<details><summary>Raw runner output</summary>'
            echo ''
            echo '```'
            if [ -n "$summary" ]; then
              echo "$summary"
            else
              echo 'NO TEST SUMMARY FOUND — the pattern no longer matches the runner output.'
            fi
            echo '```'
            echo ''
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

          # An assembly that discovers nothing is the failure this repo keeps not noticing.
          # The Dockerfile guards it with RunConfiguration.TreatNoTestsAsError; this is the
          # belt to that pair of braces, and it names which assembly went quiet.
          if [ "$domain" -eq 0 ] || [ "$api" -eq 0 ]; then
            if grep -q 'Test run for ' build.log; then
              echo "::error::An assembly executed no tests (Domain=${domain}, Api=${api}). A green build over a silent assembly is the exact trap this workflow exists to close."
              exit 1
            fi
          fi

          # If the tests were reached but their counts could not be read, fail loudly. A
          # green tick over an unread number is the exact failure mode this whole file
          # exists to end. Gated on `Test run for` so that a genuine compile error stays
          # the headline instead of being buried under a second, derivative error.
          if [ -z "$summary" ] && grep -q 'Test run for ' build.log; then
            echo "::error::Tests ran but their counts could not be extracted from build.log — fix the pattern in the 'Test counts' step."
            exit 1
          fi

  frontend:
    name: Frontend — typecheck + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Two separate Node versions are at play, and only one of them is this line.
      # The runtime the *actions themselves* run on is the runner's, not this — that is
      # what the deprecation warning was about, and it is fixed by the @v5/@v4 bumps above.
      # This is the Node the app is built and tested with: 22 LTS, because 20 went
      # end-of-life in April 2026 and pinning a major keeps the local run and CI honest
      # about each other.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # `npm ci` across the whole workspace root — the `@recruitops/*` packages are
      # workspace links, so installing per-app would not resolve them.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
