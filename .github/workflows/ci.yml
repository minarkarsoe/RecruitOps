# Continuous integration.
#
# This exists because "written but never compiled" repeated across three sessions: the
# authoring environments had no .NET SDK, no Docker, and an allowlist blocking both
# `mcr.microsoft.com` and `nuget.org`, so the ADR-0018 fix and the ADR-0019 endpoint sat in
# the working tree unverified. A hosted runner has none of those constraints, so the
# compiler runs on every push whether or not the author could run it locally.
#
# The backend job deliberately mirrors the command in CLAUDE.md rather than using
# `actions/setup-dotnet`: the Dockerfile is the packaging artefact (ADR-0015), so building
# it is also a check that the image still builds.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push on the same branch makes the previous run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — build + test (.NET 10, Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      # `--progress=plain` because BuildKit collapses test output, and
      # `--no-cache-filter=build,test` because a cached `COPY . .` layer will happily
      # re-report an old pass count — the trap documented in FEATURE-STATUS.md. Without
      # both flags a green build is not evidence the *new* tests ran.
      - name: docker build --target test
        id: build
        env:
          # BuildKit truncates a step's log at 1MiB and its rate at 100_000 B/s by default,
          # and what it drops is the END of the output — which is exactly where a test run
          # puts its summary. Run #5 passed with the Api project's `Total tests:` line simply
          # missing from the log, and the reporting step below then said "no tests executed"
          # about a suite that had just gone fully green. Unlimited here: this log is read by
          # a script, and a partial log is a wrong answer rather than a slow one.
          BUILDKIT_STEP_LOG_MAX_SIZE: -1
          BUILDKIT_STEP_LOG_MAX_SPEED: -1
        run: |
          set -o pipefail
          docker build \
            --target test \
            --progress=plain \
            --no-cache-filter=build,test \
            -t recruitops-test \
            ./backend 2>&1 | tee build.log

      # "The build passed" has never been the question in this repo — "did the new tests
      # run" is. Lift the counts out of 3,000 lines of BuildKit output and into the job
      # summary, so nobody has to trust a green tick they did not read.
      #
      # The first version of this step grepped for `Passed!`, which is the *Microsoft
      # Testing Platform* summary line. This solution runs on **VSTest**
      # (Microsoft.NET.Test.Sdk + xunit.runner.visualstudio), which ends with
      #   Test Run Successful. / Total tests: 39 / Passed: 39
      # — no exclamation mark anywhere. So the grep matched nothing, and because the
      # fallback `|| echo` was attached to a *pipeline* whose last command was `sed`
      # (exit 0), it never fired either: the summary rendered as an empty box on run #3.
      # An empty box is worse than a missing one — it looks like a report. Hence the
      # explicit emptiness check below.
      #
      # Each test project now runs in its own Dockerfile `RUN`, so every `Test run for …dll`
      # line is followed by that project's own summary. The counts below are parsed from
      # those blocks rather than by counting `Passed <name>` lines: run #4 proved why. The
      # line-counting version reported Api=21 against a runner summary of 122, because the
      # console logger's per-test output is not the stable surface — the summary is. **A
      # confidently wrong number in a report is the same failure as an empty one**, one step
      # further along, and it is the third time this step has produced one.
      #
      # It also lists the failing test names, because "8 failed" without them costs a whole
      # extra round trip through CI to learn something the log already knew.
      - name: Test counts
        if: always()
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib

          out = open(os.environ["GITHUB_STEP_SUMMARY"], "a")
          def w(s=""): out.write(s + "\n")

          w("## Backend test run")
          log = pathlib.Path("build.log")
          if not log.exists():
              w("The build step produced no log — it failed before the compiler was reached.")
              raise SystemExit(0)

          # BuildKit prefixes every line with "#<step> <elapsed> ".
          strip = re.compile(r"^#\d+\s+[\d.]+\s+")
          lines = [strip.sub("", l).rstrip()
                   for l in log.read_text(errors="replace").splitlines()]

          run_for = re.compile(r"Test run for .*?/(RecruitOps\.[A-Za-z0-9.]+)\.dll")
          # `Failed: 8` is a summary line, `Failed RecruitOps.X.Y` is a test name — the
          # mandatory whitespace before RecruitOps is what separates them.
          failed_case = re.compile(r"^\s*Failed\s+(RecruitOps\.\S+)")

          order, asm, failures, current = [], {}, [], None
          for l in lines:
              m = run_for.search(l)
              if m:
                  current = m.group(1)
                  if current not in asm:
                      order.append(current)
                      asm[current] = {"total": None, "passed": None, "failed": None, "verdict": "?"}
                  continue
              m = failed_case.match(l)
              if m:
                  failures.append(m.group(1))
                  continue
              if current is None:
                  continue
              a, s = asm[current], l.strip()
              if s.startswith("Test Run Successful"): a["verdict"] = "passed"
              elif s.startswith("Test Run Failed"):   a["verdict"] = "FAILED"
              for key, label in (("total", "Total tests:"), ("passed", "Passed:"), ("failed", "Failed:")):
                  if s.startswith(label) and a[key] is None:
                      try: a[key] = int(s[len(label):].strip())
                      except ValueError: pass

          if order:
              w("")
              w("| Assembly | Total | Passed | Failed | Result |")
              w("|---|---|---|---|---|")
              for name in order:
                  a = asm[name]
                  fmt = lambda v: "—" if v is None else str(v)
                  w(f"| {name} | {fmt(a['total'])} | {fmt(a['passed'])} | {fmt(a['failed'])} | {a['verdict']} |")
          else:
              w("")
              w("**No `Test run for …dll` line in the log — no test project was reached.**")

          if failures:
              w("")
              w(f"### {len(failures)} failing case(s)")
              w("")
              for f in failures:
                  w(f"- `{f}`")

          w("")
          w("<details><summary>Raw runner output</summary>")
          w("")
          w("```")
          keep = re.compile(r"Test run for |Test Run Successful|Test Run Failed|Total tests:|"
                            r"^\s*(Passed|Failed|Skipped):|No test is available|"
                            r"test host process crashed|error [A-Z]+[0-9]+")
          raw = [l for l in lines if keep.search(l)]
          w("\n".join(raw) if raw else "NO RUNNER OUTPUT MATCHED — the pattern is stale again.")
          w("```")
          w("")
          w("</details>")

          # THIS STEP REPORTS. IT DOES NOT ADJUDICATE.
          #
          # The build step's exit code is the authority on whether the suite passed:
          # `RunConfiguration.TreatNoTestsAsError` plus one `RUN` per project means a green
          # `docker build --target test` is impossible unless BOTH projects ran and every case
          # passed. There is nothing left for this step to decide.
          #
          # It used to decide anyway, and on run #5 it failed a fully green suite: BuildKit had
          # truncated the log, the Api summary went with it, and the step announced "no tests
          # executed" about 130 tests that had just passed. **An instrument that contradicts
          # the thing it measures is worse than no instrument** — it is the same failure as the
          # empty box and the confidently-wrong 21, for the third time, and this is the version
          # that finally removes the possibility rather than fixing the pattern.
          missing = [n for n in order if not asm[n]["total"]]
          if os.environ.get("BUILD_OUTCOME") == "success":
              if missing or len(order) < 2:
                  w("")
                  w("> ⚠️ **The build passed, so both projects ran and every case passed** — "
                    "but the counts for "
                    f"`{', '.join(missing) or 'one or more projects'}` could not be read out "
                    "of the log, most likely because BuildKit truncated it. The numbers above "
                    "are incomplete; they are not a failure.")
          elif any("No test is available" in l for l in lines):
              w("")
              w("> 🔴 **A test project discovered zero tests.** That is the failure, not a "
                "reporting gap.")
          out.close()
          PY

  frontend:
    name: Frontend — typecheck + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Two separate Node versions are at play, and only one of them is this line.
      # The runtime the *actions themselves* run on is the runner's, not this — that is
      # what the deprecation warning was about, and it is fixed by the @v5/@v4 bumps above.
      # This is the Node the app is built and tested with: 22 LTS, because 20 went
      # end-of-life in April 2026 and pinning a major keeps the local run and CI honest
      # about each other.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # `npm ci` across the whole workspace root — the `@recruitops/*` packages are
      # workspace links, so installing per-app would not resolve them.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # `set -o pipefail` is load-bearing: without it the pipeline's exit code is `tee`'s,
      # which is always 0, and a failing suite would report green. That is the same trap the
      # backend summary step's comment describes, one job down.
      - name: Test
        shell: bash
        run: set -o pipefail && npm run test 2>&1 | tee frontend-test.log

      # The backend has had a counts table since run #4; the frontend had a bare green tick.
      # That asymmetry matters more than it looks, because of one npm behaviour:
      #
      #   `npm run test --workspaces --if-present` EXITS 0 WHEN A SCRIPT IS MISSING.
      #
      # So a workspace whose tests stopped running — script renamed, removed, or a vitest
      # `include` glob that stops matching — is indistinguishable from a workspace that
      # passed. `@recruitops/public` had no tests at all until 2026-08-27 and nobody noticed;
      # this step is what stops that being true again quietly.
      #
      # It derives the expected workspaces from package.json rather than hard-coding them, so
      # adding a workspace extends the check automatically and removing a `test` script is
      # caught rather than silently shrinking the suite.
      - name: Test counts
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, sys

          LOG = pathlib.Path("frontend-test.log")
          ROOT = pathlib.Path(".")
          SUMMARY = os.environ.get("GITHUB_STEP_SUMMARY")

          # Encoding is pinned rather than inherited — the table uses em dashes, and a report
          # rendered with replacement characters is a report nobody reads.
          out = open(SUMMARY, "a", encoding="utf-8") if SUMMARY else \
                open(sys.stdout.fileno(), "w", encoding="utf-8", closefd=False)
          def w(s=""): out.write(s + "\n")

          ANSI = re.compile(r"\x1b\[[0-9;]*m")

          w("## Frontend test run")

          if not LOG.exists():
              w("The test step produced no log — it failed before vitest was reached.")
              out.close()
              raise SystemExit(1)

          lines = [ANSI.sub("", l).rstrip() for l in LOG.read_text(errors="replace").splitlines()]

          expected = {}
          for ws in json.loads((ROOT / "package.json").read_text()).get("workspaces", []):
              for pkg in sorted(ROOT.glob(f"{ws}/package.json")):
                  data = json.loads(pkg.read_text())
                  if data.get("scripts", {}).get("test"):
                      expected[data["name"]] = True

          marker = re.compile(r"^> (@recruitops/[A-Za-z0-9._-]+)@\S+ test$")
          tests_line = re.compile(r"^\s*Tests\s+(.+?)\s*$")
          files_line = re.compile(r"^\s*Test Files\s+(.+?)\s*$")
          count = re.compile(r"(\d+)\s+(passed|failed|skipped)")

          seen, order, current = {}, [], None
          for l in lines:
              m = marker.match(l)
              if m:
                  current = m.group(1)
                  if current not in seen:
                      order.append(current)
                      seen[current] = {"tests": None, "files": None}
                  continue
              if current is None:
                  continue
              m = tests_line.match(l)
              if m and seen[current]["tests"] is None and count.search(m.group(1)):
                  seen[current]["tests"] = m.group(1); continue
              m = files_line.match(l)
              if m and seen[current]["files"] is None and count.search(m.group(1)):
                  seen[current]["files"] = m.group(1)

          def totals(s):
              if not s: return 0, 0
              d = {k: int(v) for v, k in count.findall(s)}
              return d.get("passed", 0), d.get("failed", 0)

          def cell(s):
              # vitest's failing summary is `2 failed | 22 passed (24)`. That pipe is a column
              # separator in Markdown, so an unescaped one splits the row into six columns and
              # the report renders as garbage exactly when something has gone wrong.
              return "—" if not s else s.replace("|", "\\|")

          w("")
          w("| Workspace | Test files | Tests | Result |")
          w("|---|---|---|---|")

          problems, gp, gf = [], 0, 0
          for name in sorted(expected):
              got = seen.get(name)
              if got is None or got["tests"] is None:
                  w(f"| `{name}` | — | — | **DID NOT RUN** |")
                  problems.append(f"`{name}` has a `test` script but produced no vitest summary.")
                  continue
              p, f = totals(got["tests"])
              gp += p; gf += f
              w(f"| `{name}` | {cell(got['files'])} | {cell(got['tests'])} | {'FAILED' if f else 'passed'} |")

          for name in order:
              if name not in expected:
                  w(f"| `{name}` | — | {cell(seen[name]['tests'])} | ran, but declares no test script |")

          w("")
          w(f"**{gp} passed, {gf} failed** across {len(expected)} workspace(s).")

          if problems:
              w("")
              w("### This report is not trustworthy")
              w("")
              for p in problems:
                  w(f"- {p}")
              w("")
              w("`npm run test --workspaces --if-present` exits 0 when a script is missing, so a "
                "workspace whose tests stopped running is indistinguishable from one that passed. "
                "That is what this check exists to catch.")

          out.close()

          # THIS STEP REPORTS, and adjudicates exactly one thing the test step cannot: whether
          # every workspace claiming to have tests actually produced a summary. Whether those
          # tests passed is the test step's exit code, and nothing here second-guesses it.
          raise SystemExit(1 if problems else 0)
          PY

      - name: Build
        run: npm run build
