server {
  listen 80;
  root /usr/share/nginx/html;

  # Proxy all /api/* calls to the ASP.NET Core API container.
  # In docker compose the API service is reachable at http://api:8080.
  # Keeping the /api prefix intact: proxy_pass without a path suffix means
  # nginx forwards the full URI, so /api/auth/login → http://api:8080/api/auth/login.
  location /api/ {
    proxy_pass         http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header   Host              $http_host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # SPA catch-all: unknown paths fall back to index.html so the React router
  # handles client-side navigation on hard refresh or direct URL entry.
  #
  # Security headers live HERE, not at server level: /api/ responses already carry the API's own
  # (SecurityHeaders.cs), and a server-level add_header would duplicate them there.
  #
  # The CSP is the main defence for the token, which sits in sessionStorage where any injected
  # script could read it. The built app is one module script and one stylesheet from this origin
  # (no inline script, no inline <style>); the design kit's fonts (Inter, JetBrains Mono, Noto Sans
  # Myanmar) come from Google Fonts, so style-src/font-src name exactly those two origins and
  # script-src stays 'self'. An install with no internet loses the fonts regardless — self-hosting
  # them would remove both the dependency and these two exceptions.
  # React's style={...} writes through the CSSOM and is not affected by style-src.
  # img-src and frame-src allow blob: for the pre-boarding document viewer (ADR-0030 §5b): an NRC scan
  # or a PDF is fetched with the recruiter's token and shown from an object URL in a dialog, one at a
  # time, rather than downloaded into their Downloads folder. Only this page's own script can mint a
  # blob: URL, and object-src stays 'none'.
  # A blob: document inherits this policy, and Chrome's PDF viewer wraps the file in a page with two
  # inline style attributes; blocked, the PDF shrinks to a 150px strip. style-src-attr allows exactly
  # those two values by hash ('unsafe-hashes'), not inline styles in general. Measured on Chromium 141
  # (2026-10-23): if Chrome changes them, a PDF shows small again — degraded, not broken.
  # HSTS belongs wherever TLS terminates; this server listens on plain HTTP.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; img-src 'self' data: blob:; frame-src blob:; style-src-attr 'unsafe-hashes' 'sha256-jpJOxTrdc58x4woq2mVygDDIvjIAGNkLZ2yfx4ppdXo=' 'sha256-tbWZ4NP1341cpcrZVDn7B3o9bt/muXgduILAnC0Zbaw='; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }
}
