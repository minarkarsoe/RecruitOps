# EDGE_PROXY=cloudflare — Method A of docs/architecture/cloudflare-integration-guide.md (DNS proxied
# through Cloudflare, "orange cloud").
#
# Behind Cloudflare the TCP peer is a Cloudflare edge server, never the visitor, so without this every
# visitor shared one login rate-limit bucket (ADR-0016) and the audit log recorded Cloudflare's
# addresses (ADR-0027) — security review of ADR-0029, L6. nginx takes the visitor's address from
# CF-Connecting-IP **only when the peer is one of the ranges below**: a client connecting to the
# server directly cannot choose its address by sending the header, because its own address is not
# in the list. (Firewalling the origin to these ranges is still worth doing — it stops anyone
# bypassing Cloudflare's WAF — but the address is right either way.)
#
# ⚠️ The ranges were written from Cloudflare's published list as known on 2026-10-21 and could not
# be re-fetched from where this file was written. Run ./update-cloudflare.sh before going live, and
# yearly: it rewrites this file from https://www.cloudflare.com/ips-v4 and /ips-v6.
real_ip_header    CF-Connecting-IP;
set_real_ip_from  173.245.48.0/20;
set_real_ip_from  103.21.244.0/22;
set_real_ip_from  103.22.200.0/22;
set_real_ip_from  103.31.4.0/22;
set_real_ip_from  141.101.64.0/18;
set_real_ip_from  108.162.192.0/18;
set_real_ip_from  190.93.240.0/20;
set_real_ip_from  188.114.96.0/20;
set_real_ip_from  197.234.240.0/22;
set_real_ip_from  198.41.128.0/17;
set_real_ip_from  162.158.0.0/15;
set_real_ip_from  104.16.0.0/13;
set_real_ip_from  104.24.0.0/14;
set_real_ip_from  172.64.0.0/13;
set_real_ip_from  131.0.72.0/22;
set_real_ip_from  2400:cb00::/32;
set_real_ip_from  2606:4700::/32;
set_real_ip_from  2803:f800::/32;
set_real_ip_from  2405:b500::/32;
set_real_ip_from  2405:8100::/32;
set_real_ip_from  2a06:98c0::/29;
set_real_ip_from  2c0f:f248::/32;
