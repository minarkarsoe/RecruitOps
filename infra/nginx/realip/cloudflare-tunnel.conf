# EDGE_PROXY=cloudflare-tunnel — Method B of docs/architecture/cloudflare-integration-guide.md.
#
# cloudflared runs inside this container's network namespace (the `cloudflare-tunnel` profile in
# docker-compose.prod.yml), so it reaches nginx from 127.0.0.1 and nothing else can: published
# ports arrive from outside the namespace (Docker's NAT keeps the visitor's address; its userland
# proxy uses the bridge gateway's), never from loopback. Trusting exactly 127.0.0.1 therefore
# trusts exactly the tunnel — no Docker subnet to pin, nothing a stranger can forge.
real_ip_header    CF-Connecting-IP;
set_real_ip_from  127.0.0.1;
