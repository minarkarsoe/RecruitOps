events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;
    server_tokens off;

    # Port 80 carries nothing of the product (ADR-0029). Until then this file listened only here,
    # while docker-compose.prod.yml published 443 to nothing — so every install served sign-in,
    # passwords, tokens and CVs in plain text.
    server {
        listen 80;
        server_name _;

        # Let's Encrypt HTTP-01: `certbot renew --webroot -w $ACME_WEBROOT` writes the challenge
        # file, the CA fetches it here. Nothing else under this path is served.
        location /.well-known/acme-challenge/ {
            root /var/www/acme;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # Two files in TLS_CERT_DIR (docker-compose.prod.yml). Any CA works — Let's Encrypt, the
        # customer's own, or a Cloudflare Origin certificate behind Cloudflare's "Full (strict)".
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Mozilla "intermediate": TLS 1.2 and 1.3, forward-secret AEAD suites only.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Once a browser has seen this, it will not use plain HTTP for this host for a year — even
        # if someone strips the redirect above. No includeSubDomains: the host is often a
        # subdomain of the customer's own domain, whose other hosts are not ours to pin.
        add_header Strict-Transport-Security "max-age=31536000" always;

        # Every location below inherits these (none sets its own).
        # X-Forwarded-For is appended, not replaced: the API trusts only its last entry — the one
        # written here — through ForwardLimit = 1 (Program.cs), so a client-sent value is ignored.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /healthz {
            proxy_pass http://backend:8080/healthz;
        }

        location /health {
            proxy_pass http://backend:8080/health;
        }

        # API backend reverse proxy
        location /api/ {
            proxy_pass http://backend:8080/api/;
            proxy_read_timeout 90s;
        }

        # Public job pages & applicant forms (Next.js SSR)
        location /jobs/ {
            proxy_pass http://frontend-public:3000/jobs/;
        }

        # Internal authenticated dashboards (Vite SPA)
        location / {
            proxy_pass http://frontend-internal:80/;
        }
    }
}
