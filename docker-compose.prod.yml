# Production Docker Compose topology for RecruitOps per-company install (ADR-0004 & ADR-0015 & ADR-0016).
# Usage: docker compose -f docker-compose.prod.yml up -d --build
# Needs a TLS certificate first — docs/architecture/deployment-runbook.md, section 0b (ADR-0029).
name: recruitops-prod

# MinIO server, with `mc` and a shell in the same image (ADR-0029 — `minio/minio` and `minio/mc`
# no longer exist on Docker Hub). Pinned by digest; bump it on purpose, in BOTH compose files:
#   docker pull chainguard/minio:latest
#   docker image inspect chainguard/minio:latest --format '{{index .RepoDigests 0}}'
# Pinned 2026-10-16: `minio --version` = RELEASE.2026-09-22T19-25-18Z, image built 2026-10-13.
x-minio-image: &minio-image chainguard/minio:latest@sha256:2136d593beacf4461187035eca949fe49abd589d5079735025c711ca58fee0c8

services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-recruitops}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init-pgtrgm.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-recruitops}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot, before MinIO starts: hand the data volume to the image's non-root user (65532).
  # Installs from before ADR-0029 ran minio/minio as root, and on root-owned data the new image
  # stops at once with "Unable to write to the backend" — so an upgrade without this loses storage.
  storage-init:
    image: *minio-image
    user: "0:0"
    # -h: re-own a symlink itself, never what it points at. Root, but with no network and only the
    # two capabilities this needs: CHOWN, and DAC_OVERRIDE to enter MinIO's 700 directories, which
    # belong to 65532 from the second run on (without it every later `up` fails — measured). Not
    # DAC_READ_SEARCH, which also does it but re-enables open_by_handle_at, the syscall behind the
    # "Shocker" container breakout; DAC_OVERRIDE is in Docker's default set anyway.
    entrypoint: ["chown", "-hR", "65532:65532", "/data"]
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - miniodata:/data

  storage:
    image: *minio-image
    restart: always
    depends_on:
      storage-init:
        condition: service_completed_successfully
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?Set MINIO_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?Set MINIO_PASSWORD in .env}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Creates the CV bucket and makes it PRIVATE, on every start — an install whose bucket was made
  # public by an older version of this file is closed by its next `up`. That older version set
  # `anonymous download`: anything that could reach the storage service could list every CV and
  # fetch it with no credentials. Nothing needs it — CVs reach a browser only through the API,
  # which checks who is asking. If the bucket cannot be confirmed private this exits 1, and the
  # API does not start.
  create-buckets:
    image: *minio-image
    depends_on:
      storage:
        condition: service_healthy
    environment:
      MINIO_USER: ${MINIO_USER}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        # The API uses these same credentials. The published default would make every CV readable
        # by anything that can reach storage:9000, private bucket or not.
        case "$$MINIO_USER:$$MINIO_PASSWORD" in
          minioadmin:* | *:minioadmin) echo "MINIO_USER / MINIO_PASSWORD are the published default - set your own in .env" >&2; exit 1 ;;
        esac
        mc alias set myminio http://storage:9000 "$$MINIO_USER" "$$MINIO_PASSWORD" > /dev/null
        mc alias set anonymous http://storage:9000 "" "" > /dev/null
        mc mb --ignore-existing myminio/recruitops-cvs
        # `set none` on the bucket does NOT remove a rule scoped to a prefix (measured: it reports
        # `custom` and the files stay readable), so each listed rule is removed as well.
        mc anonymous set none myminio/recruitops-cvs
        mc anonymous list myminio/recruitops-cvs | while IFS= read -r rule; do
          prefix=$${rule%% => *}
          mc anonymous set none "myminio/$${prefix%\*}"
        done
        # A hand-written policy (wildcards mid-path, conditions, s3:Get*) survives both, and some
        # shapes are not listed at all. Replace the whole document with an empty one, then reset.
        case "$$(mc anonymous get myminio/recruitops-cvs)" in *'`private`'*) ;; *)
          printf '%s' '{"Version":"2012-10-17","Statement":[]}' > /tmp/no-anonymous.json
          mc anonymous set-json /tmp/no-anonymous.json myminio/recruitops-cvs
          mc anonymous set none myminio/recruitops-cvs ;;
        esac
        # Three independent checks. The listing alone is not enough: a custom JSON policy granting
        # GetObject lists as "=> none" while anonymous reads succeed (measured 2026-10-16).
        fail() { echo "recruitops-cvs is NOT private ($$1) - stopping" >&2; exit 1; }
        case "$$(mc anonymous get myminio/recruitops-cvs)" in *'`private`'*) ;; *) fail "policy is not private" ;; esac
        [ -z "$$(mc anonymous list myminio/recruitops-cvs)" ] || fail "anonymous rules remain"
        if mc ls anonymous/recruitops-cvs > /dev/null 2>&1; then fail "listable without credentials"; fi
        echo "recruitops-cvs is private"

  backend:
    build:
      context: ./backend
      target: final
    restart: always
    networks:
      default:
        aliases:
          - api
    depends_on:
      db:
        condition: service_healthy
      create-buckets:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:-recruitops};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Issuer: recruitops
      Jwt__Audience: recruitops-api
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env - must be at least 32 characters}
      # First Administrator. Outside Development the API uses these ONLY while the database has
      # no users at all, needs a 12+ character password, and ignores them afterwards — remove
      # both from .env once the install is up. Until ADR-0029 this file did not pass them, so a
      # fresh production install had no way to create anyone who could sign in.
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:-}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-}
      # ADR-0016: Crucial for production security. Rate limiter trusts X-Forwarded-For because
      # backend port is not published to the host.
      ReverseProxy__TrustForwardedHeaders: "true"
      FileStorage__ServiceUrl: "http://storage:9000"
      FileStorage__PublicServiceUrl: "${STORAGE_PUBLIC_URL:-http://localhost:9000}"
      FileStorage__BucketName: "recruitops-cvs"
      FileStorage__AccessKey: ${MINIO_USER}
      FileStorage__SecretKey: ${MINIO_PASSWORD}
      FileStorage__ForcePathStyle: "true"
      FeatureFlags__EnableAiProfiling: "${FEATURE_AI_PROFILING:-true}"
      FeatureFlags__EnableAnalytics: "${FEATURE_ANALYTICS:-true}"
      FeatureFlags__EnableBulkCvUpload: "${FEATURE_BULK_CV_UPLOAD:-true}"
      FeatureFlags__EnableSmartMatch: "${FEATURE_SMART_MATCH:-true}"
      FeatureFlags__EnableFullTextSearch: "${FEATURE_FULLTEXT_SEARCH:-true}"
    # NOTE: API port is intentionally NOT published to host in production.
    # Traffic must route through the Nginx reverse proxy.

  frontend-internal:
    build:
      context: .
      dockerfile: frontend/internal/Dockerfile
      target: final
    restart: always
    depends_on:
      - backend

  frontend-public:
    build:
      context: .
      dockerfile: frontend/public/Dockerfile
      target: final
    restart: always
    depends_on:
      - backend
    environment:
      API_INTERNAL_URL: "http://backend:8080/api"
      NEXT_PUBLIC_API_BASE_URL: "/api"

  proxy:
    image: nginx:alpine
    restart: always
    # 443 serves the product; 80 only answers certificate renewals and redirects to 443
    # (infra/nginx/nginx.conf, ADR-0029).
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # The certificate, as `fullchain.pem` + `privkey.pem`. Required: without it this file would
      # serve sign-in, passwords and CVs over plain HTTP, which is what it did before ADR-0029.
      - ${TLS_CERT_DIR:?Set TLS_CERT_DIR in .env - a directory holding fullchain.pem and privkey.pem}:/etc/nginx/certs:ro
      # Let's Encrypt renewals: `certbot renew --webroot -w $ACME_WEBROOT` writes challenges here.
      - ${ACME_WEBROOT:-./infra/acme}:/var/www/acme:ro
      # What sits in front: none | cloudflare | cloudflare-tunnel (infra/nginx/realip/). Long form
      # with create_host_path false, so a misspelt value stops `up` with "no such file" instead of
      # Docker quietly creating a directory that nginx then refuses to include.
      - type: bind
        source: ./infra/nginx/realip/${EDGE_PROXY:-none}.conf
        target: /etc/nginx/realip.conf
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - backend
      - frontend-internal
      - frontend-public

  # Cloudflare Tunnel (Method B of the Cloudflare guide). Off unless started with
  # `--profile cloudflare-tunnel`, and then needs EDGE_PROXY=cloudflare-tunnel and
  # CLOUDFLARE_TUNNEL_TOKEN. It shares the proxy's network namespace, so it reaches nginx on
  # 127.0.0.1 — the one address realip/cloudflare-tunnel.conf trusts — and in the Cloudflare
  # dashboard the route is https://localhost:443 (Origin Server Name = your hostname). With the
  # tunnel up, drop the proxy's published ports in an override file: nothing needs them.
  tunnel:
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    profiles: ["cloudflare-tunnel"]
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      # Not `:?` — Compose interpolates every service, profile or not, so a required variable here
      # would stop `up` for installs that never use the tunnel. cloudflared refuses an empty token.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    network_mode: "service:proxy"
    depends_on:
      - proxy

volumes:
  pgdata:
  miniodata:
